<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found · Unblind UX</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--coral:#E8573E;--coral-mid:#EF6548;--ink:#1A1A1A;--body:#424242;--olive-tint:#EBEEDD}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 480px at 80% -10%,var(--olive-tint),#fff);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
  .box{max-width:520px}
  img{height:30px;width:auto;margin:0 auto 40px}
  h1{font-size:88px;font-weight:800;letter-spacing:-.04em;color:var(--coral);line-height:1}
  h2{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:16px 0 12px}
  p{color:var(--body);font-size:18px;margin-bottom:32px}
  a.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px;padding:16px 30px;border-radius:100px;text-decoration:none;background:var(--coral);color:#fff;transition:background .15s ease,transform .15s ease}
  a.btn:hover{background:var(--coral-mid);transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo.svg" alt="Unblind UX">
    <h1>404</h1>
    <h2>This page took a wrong turn.</h2>
    <p>The page you were looking for is not here. Let's get you back on track.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
